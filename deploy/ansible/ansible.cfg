# ABOUTME: Ansible defaults for the playground droplet; the inventory comes from `terraform apply`.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False

[ssh_connection]
pipelining = True
# A fresh droplet has a fresh host key; accept it on first contact but refuse a changed one later.
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
